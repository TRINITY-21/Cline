name: Daily Predictions Scraper

on:
  schedule:
    # Scrape predictions at 6 AM UTC daily
    - cron: '0 6 * * *'
    # Update results at midnight UTC (00:00)
    - cron: '0 0 * * *'
    # Update weekly results every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'scrape'
        type: choice
        options:
          - scrape
          - update-results
          - update-weekly-results

jobs:
  scrape-predictions:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'scrape' || github.event_name == 'schedule'
    steps:
      - name: Check if should scrape (6 AM only)
        id: should-scrape
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "06" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout code
        if: steps.should-scrape.outputs.skip == 'false'
        uses: actions/checkout@v4
      
      - name: Set up Python
        if: steps.should-scrape.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        if: steps.should-scrape.outputs.skip == 'false'
        run: |
          pip install -r scripts/requirements.txt
      
      - name: Get today's date
        if: steps.should-scrape.outputs.skip == 'false'
        id: date
        run: |
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
      
      - name: Scrape predictions
        if: steps.should-scrape.outputs.skip == 'false'
        id: scrape
        run: |
          python3 scripts/scrape-betistuta-predictions.py ${{ steps.date.outputs.date }} > predictions.json 2>scrape.log
          echo "📊 Scrape log:"
          cat scrape.log || true
          echo ""
          echo "📄 JSON preview:"
          head -c 500 predictions.json || echo "No JSON output"
      
      - name: Save to Firestore
        if: steps.should-scrape.outputs.skip == 'false'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "💾 Saving to Firestore..."
          python3 scripts/save-predictions-to-firestore.py predictions.json
          echo "✅ Save completed"
      
      - name: Upload predictions JSON
        if: steps.should-scrape.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ steps.date.outputs.date }}
          path: predictions.json
          retention-days: 7

  update-results:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'update-results' || github.event_name == 'schedule'
    steps:
      - name: Check if should update (midnight only)
        id: should-update
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout code
        if: steps.should-update.outputs.skip == 'false'
        uses: actions/checkout@v4
      
      - name: Set up Python
        if: steps.should-update.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        if: steps.should-update.outputs.skip == 'false'
        run: |
          pip install -r scripts/requirements.txt
      
      - name: Get yesterday's date
        if: steps.should-update.outputs.skip == 'false'
        id: date
        run: |
          # Calculate yesterday's date in UTC using Python for reliability
          python3 -c "from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=1)).strftime('%Y-%m-%d'))" > yesterday.txt
          echo "date=$(cat yesterday.txt)" >> $GITHUB_OUTPUT
          echo "📅 Updating results for: $(cat yesterday.txt)"
      
      - name: Scrape results
        if: steps.should-update.outputs.skip == 'false'
        id: results
        run: |
          echo "🔍 Scraping results for: ${{ steps.date.outputs.date }}"
          python3 scripts/update-prediction-results.py ${{ steps.date.outputs.date }} > results.json 2>results.log || exit 1
          echo "📊 Results log:"
          cat results.log || true
          echo ""
          echo "📄 JSON preview:"
          if [ -f results.json ] && [ -s results.json ]; then
            head -c 500 results.json
            echo ""
            echo "✅ Results JSON generated successfully"
          else
            echo "⚠️ No JSON output or file is empty"
            exit 1
          fi
      
      - name: Update Firestore
        if: steps.should-update.outputs.skip == 'false' && steps.results.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "💾 Updating Firestore with results..."
          if [ ! -f results.json ] || [ ! -s results.json ]; then
            echo "❌ results.json is missing or empty"
            exit 1
          fi
          python3 scripts/update-results-in-firestore.py results.json || exit 1
          echo "✅ Update completed"
      
      - name: Upload results JSON
        if: steps.should-update.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: results-${{ steps.date.outputs.date }}
          path: results.json
          retention-days: 7

  update-weekly-results:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'update-weekly-results' || github.event_name == 'schedule'
    steps:
      - name: Check if should update (every 3 hours)
        id: should-update-weekly
        run: |
          HOUR=$(date -u +%H)
          HOUR_NUM=$((10#$HOUR))
          # Run every 3 hours: 0, 3, 6, 9, 12, 15, 18, 21
          if [ $((HOUR_NUM % 3)) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Running at hour: $HOUR_NUM"
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping at hour: $HOUR_NUM (not divisible by 3)"
          fi
      
      - name: Checkout code
        if: steps.should-update-weekly.outputs.skip == 'false'
        uses: actions/checkout@v4
      
      - name: Set up Python
        if: steps.should-update-weekly.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        if: steps.should-update-weekly.outputs.skip == 'false'
        run: |
          pip install -r scripts/requirements.txt
      
      - name: Update weekly results
        if: steps.should-update-weekly.outputs.skip == 'false'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "🔄 Updating weekly results..."
          python3 scripts/update-weekly-results.py
          echo "✅ Weekly results update completed"

