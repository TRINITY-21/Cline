name: Fetch Match Results

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Check if API URL is configured
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "⚠️  API_BASE_URL secret is not set. Skipping cron job."
            echo "💡 Set up your deployment and add the API_BASE_URL secret to enable automatic updates."
            exit 0
          fi

      - name: Fetch Match Results
        run: |
          echo "Fetching match results from betistuta.net..."
          # Fetch results for yesterday (most matches would have finished)
          python3 scripts/fetch_match_results.py --out data/match_results.json --days 1
          
          if [ ! -f data/match_results.json ]; then
            echo "Error: Results file not created."
            exit 1
          fi
          
          RESULT_COUNT=$(jq 'length' data/match_results.json 2>/dev/null || echo "0")
          echo "✅ Found $RESULT_COUNT result(s)"

      - name: Update Predictions with Results
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_INTERNAL_UPDATE_TOKEN: ${{ secrets.INTERNAL_UPDATE_TOKEN }}
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "⚠️  API_BASE_URL secret is not set. Skipping API update."
            exit 0
          fi
          
          if [ ! -f data/match_results.json ]; then
            echo "⚠️  match_results.json not found. Skipping update."
            exit 0
          fi
          
          RESULT_COUNT=$(jq 'length' data/match_results.json 2>/dev/null || echo "0")
          if [ "$RESULT_COUNT" = "0" ] || [ -z "$RESULT_COUNT" ]; then
            echo "⚠️  No results to process."
            exit 0
          fi
          
          echo "Updating predictions with $RESULT_COUNT result(s)..."
          
          # Create request body with results array
          # Use --data-binary with a temp file to avoid "Argument list too long" error
          jq -n --argjson results "$(cat data/match_results.json)" '{results: $results}' > /tmp/request_body.json
          
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ env.API_BASE_URL }}/api/admin/predictions/update-results" \
            -H "x-internal-token: ${{ env.NEXT_PUBLIC_INTERNAL_UPDATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary "@/tmp/request_body.json")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep -oP 'HTTP_STATUS:\K\d+')
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          
          echo "$BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Predictions updated successfully"
          else
            echo "⚠️  Update failed with HTTP $HTTP_STATUS"
            exit 1
          fi

