name: Scrape Predictions Daily

on:
  schedule:
    # Runs daily at 02:00 UTC (adjust timezone as needed)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Check if API URL is configured
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "⚠️  API_BASE_URL secret is not set. Skipping cron job."
            echo "💡 Set up your deployment and add the API_BASE_URL secret to enable automatic scraping."
            exit 0
          fi
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: |
          pip3 install requests beautifulsoup4
      
      - name: Scrape and import predictions
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "⚠️  API_BASE_URL secret is not set. Skipping API call."
            exit 0
          fi
          echo "Scraping betistuta for Over 3.5 predictions..."
          python3 scripts/scrape_betistuta_over35.py > scraped_predictions.json
          
          # Check if we have predictions
          PREDICTION_COUNT=$(python3 -c "import json; data = json.load(open('scraped_predictions.json')); print(data.get('count', 0))")
          
          if [ "$PREDICTION_COUNT" -eq "0" ]; then
            echo "⚠️  No predictions found. Skipping import."
            exit 0
          fi
          
          echo "Found $PREDICTION_COUNT predictions. Importing to Firestore..."
          curl -X POST "${{ secrets.API_BASE_URL }}/api/admin/predictions/import-scraped" \
            -H "Content-Type: application/json" \
            -H "x-internal-token: ${{ secrets.INTERNAL_UPDATE_TOKEN }}" \
            -d @scraped_predictions.json \
            -w "\nHTTP Status: %{http_code}\n" \
            --fail-with-body || {
              echo "⚠️  Import failed - check your deployment URL and token"
              exit 1
            }
          
          # Also scrape and update results
          echo ""
          echo "Scraping actual match results..."
          python3 scripts/scrape_predictions_results.py > scraped_results.json
          
          RESULT_COUNT=$(python3 -c "import json; data = json.load(open('scraped_results.json')); print(data.get('count', 0))")
          
          if [ "$RESULT_COUNT" -gt "0" ]; then
            echo "Found $RESULT_COUNT results. Updating predictions..."
            curl -X POST "${{ secrets.API_BASE_URL }}/api/admin/predictions/update-results-scraped" \
              -H "Content-Type: application/json" \
              -H "x-internal-token: ${{ secrets.INTERNAL_UPDATE_TOKEN }}" \
              -d @scraped_results.json \
              -w "\nHTTP Status: %{http_code}\n" \
              --fail-with-body || {
                echo "⚠️  Results update failed - continuing anyway"
              }
          else
            echo "No results found to update"
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_UPDATE_TOKEN: ${{ secrets.INTERNAL_UPDATE_TOKEN }}

