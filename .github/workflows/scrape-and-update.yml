name: Scrape and Update Matches

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          pip install selenium beautifulsoup4 requests

      - name: Install Chrome/Chromium
        uses: browser-actions/setup-chrome@latest

      - name: Run scraper
        env:
          API_BASE: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_INTERNAL_UPDATE_TOKEN: ${{ secrets.INTERNAL_UPDATE_TOKEN }}
        run: |
          # Run the scraper
          python3 scripts/selenium_rojadirecta.py --out /tmp/scraped_matches.json || echo "Scraper failed, continuing..."
          
          # Check if we got any data
          if [ ! -f /tmp/scraped_matches.json ] || [ ! -s /tmp/scraped_matches.json ]; then
            echo "⚠️  No scraped data found or scraper failed"
            exit 0
          fi
          
          # Read the JSON and send to compare-and-update endpoint
          SCRAPED_DATA=$(cat /tmp/scraped_matches.json)
          
          echo "📊 Sending scraped data to compare-and-update endpoint..."
          curl -X POST "${{ secrets.API_BASE_URL }}/api/admin/scrape/compare-and-update" \
            -H "x-internal-token: ${{ secrets.INTERNAL_UPDATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"matches\": $SCRAPED_DATA}" \
            -w "\nHTTP Status: %{http_code}\n" \
            --fail-with-body || echo "⚠️  Update failed - check your deployment URL and token"

