name: Update Results Every 3 Hours

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Check if API URL is configured
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "⚠️  API_BASE_URL secret is not set. Skipping cron job."
            echo "💡 Set up your deployment and add the API_BASE_URL secret to enable automatic result updates."
            exit 0
          fi
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: |
          pip3 install requests beautifulsoup4
      
      - name: Scrape and update results
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "⚠️  API_BASE_URL secret is not set. Skipping API call."
            exit 0
          fi
          echo "Scraping betistuta for actual match results..."
          python3 scripts/scrape_predictions_results.py > scraped_results.json
          
          # Check if we have results
          RESULT_COUNT=$(python3 -c "import json; data = json.load(open('scraped_results.json')); print(data.get('count', 0))" 2>/dev/null || echo "0")
          
          if [ "$RESULT_COUNT" -eq "0" ]; then
            echo "⚠️  No results found. No predictions to update."
            exit 0
          fi
          
          echo "Found $RESULT_COUNT results. Updating predictions in Firestore..."
          curl -X POST "${{ secrets.API_BASE_URL }}/api/admin/predictions/update-results-scraped" \
            -H "Content-Type: application/json" \
            -H "x-internal-token: ${{ secrets.INTERNAL_UPDATE_TOKEN }}" \
            -d @scraped_results.json \
            -w "\nHTTP Status: %{http_code}\n" \
            --fail-with-body || {
              echo "⚠️  Results update failed - check your deployment URL and token"
              exit 1
            }
          
          echo "✅ Successfully updated predictions with results"
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_UPDATE_TOKEN: ${{ secrets.INTERNAL_UPDATE_TOKEN }}

