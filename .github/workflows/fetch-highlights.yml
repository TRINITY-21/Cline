name: Fetch Today's Highlights

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  fetch-highlights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-key.json
            echo "✅ Firebase credentials set from JSON"
          else
            echo "⚠️  FIREBASE_SERVICE_ACCOUNT_JSON secret not found"
            exit 1
          fi

      - name: Fetch Today's Highlights
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "Fetching today's highlights from dasfootball.com..."
          npx tsx scripts/fetch-today-highlights.ts

      - name: Summary
        run: |
          echo "✅ Highlights fetch job completed"
          echo "📅 Next run in 3 hours"

